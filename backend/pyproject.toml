[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-research-backend"
version = "0.1.0"
description = "Local-first legal case research development scaffold"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pypdf>=6,<7", "fonttools>=4,<5", "openai>=2,<3", "python-dotenv>=1,<2", "httpx[socks]>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
